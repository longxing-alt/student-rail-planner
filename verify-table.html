<h1>🎫 出票置信度验证表</h1>
<div class="sub">
  按当前走廊带算法，列出<b>区间内每站</b>的预测票态与置信度，<b>置信度低的排最上面</b>（这些最需要你用真实出票验证）。<br>
  用法：① 填 学校/出发地（默认 武汉/长沙）→ ② 每天验证 4 个：在「我的实测」选 <b>可出票 / 被拦截</b>，或勾选「我手动改过=正确」→ ③ 点【校准参数】自动拟合带宽，直到与你的数据一致 → 收敛后再更新正式逻辑。
</div>

<div class="bar">
  <div class="f"><label>学校</label><input id="S" value="武汉"></div>
  <div class="f"><label>出发地(区间端点)</label><input id="H" value="长沙"></div>
  <div class="f"><label>核心带宽 k1</label><input id="k1" type="number" step="0.01" value="0.32"></div>
  <div class="f"><label>边缘带宽 k2</label><input id="k2" type="number" step="0.01" value="0.45"></div>
  <button class="ghost" onclick="gen()">生成表格</button>
  <button class="primary" onclick="calibrate()">📐 校准参数</button>
  <button class="ghost" onclick="exportCSV()">⬇ 导出 CSV</button>
  <button class="ghost" onclick="clearRec()">清空我的记录</button>
</div>

<div class="stats" id="stats"></div>
<div class="calib" id="calib"></div>
<div class="note" id="hint"></div>

function cleanCity(x){return String(x||'').replace(/市|省|自治州|地区|盟|县|区|壮族|回族|维吾尔|苗|侗|布依|彝|土家族/g,'')}
function st(name){
  const qn=cleanCity(name);
  const hit=STATIONS.find(s=>s[0]===qn||s[1]===qn)||STATIONS.find(s=>s[1].includes(qn)||qn.includes(s[1]));
  return hit?{name:hit[0],city:hit[1],lat:hit[2],lon:hit[3]}:null;
}
const R=6371;
function dist(a,b){const dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));}
function corr(S,H,D){const lat0=(S.lat+H.lat)/2*Math.PI/180;const X=l=>(l.lon-S.lon)*111.32*Math.cos(lat0),Y=l=>(l.lat-S.lat)*110.57;
  const hx=X(H),hy=Y(H),dx=X(D),dy=Y(D),L2=hx*hx+hy*hy;if(L2<1e-6)return{t:0,p:Math.hypot(dx,dy)};
  const t=(dx*hx+dy*hy)/L2;return{t,p:Math.hypot(dx-hx*t,dy-hy*t)};}
function judge(S,H,D,k1,k2){
  const L=dist(S,H); if(L<15)return dist(S,D)<=50?2:0;
  const {t,p}=corr(S,H,D);
  const inCore=t>=-0.05&&t<=1.05&&p<=Math.max(60,0.32*L)*Math.max(1,k1/0.32);
  if(inCore)return 2;
  const inEdge=t>=-0.5&&t<=1.5&&p<=Math.max(90,0.45*L)*Math.max(1,k2/0.45);
  return inEdge?1:0;
}
/* 每站评估: 状态+置信度+依据 (端点内宽带, 越出端点收紧) */
function assess(S,H,D,k1,k2){
  const L=dist(S,H);
  const {t,p}=corr(S,H,D);
  const coreBand=(t>1.0||t<0.0)?45:Math.max(60,0.32*L)*(k1/0.32);
  const edgeBand=(t>1.0||t<0.0)?60:Math.max(90,0.45*L)*(k2/0.45);
  const dS=dist(S,D), dH=dist(H,D);
  let cls, conf;
  if(t>=-0.05&&t<=1.05&&p<=coreBand){ cls=2; const m=(coreBand-p)/coreBand; conf=Math.round(40+60*Math.max(0,Math.min(1,m))); }
  else if(t>=-0.5&&t<=1.5&&p<=edgeBand){ cls=1; const nearIn=(coreBand-p)/coreBand; const nearOut=(edgeBand-p)/edgeBand; conf=Math.round(35+10*Math.min(1,Math.max(0,nearOut))-(nearIn>0?15:0)); if(conf<15)conf=15; }
  else { cls=0; const m=(p-edgeBand)/edgeBand; conf=Math.round(40+60*Math.max(0,Math.min(1,m))); }
  // 端点端部(t 越界)额外降置信
  if(t<-0.05&&t>-0.15||t>1.05&&t<1.15) conf=Math.round(conf*0.7);
  if(conf<5)conf=5; if(conf>98)conf=98;
  const evidence=
    't='+t.toFixed(2)+' p='+Math.round(p)+'km / 带宽 '+Math.round(coreBand)+'~'+Math.round(edgeBand)+'km'+
    ' · 距校 '+Math.round(dS)+'km · 距发 '+Math.round(dH)+'km'+
    (t<=-0.5||t>=1.5?' · 端点外(t越界)':p>edgeBand?' · 偏离走廊过远':p>coreBand?' · 落在边缘带':' · 在核心带内');
  return {cls,conf,evidence,t:+t.toFixed(2),p:Math.round(p)};
}
/* 表格渲染 */
let storeKey='spr_verify_records_v1';
function loadRec(){try{return JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){return {}}}
function saveRec(r){try{localStorage.setItem(storeKey,JSON.stringify(r))}catch(e){}}
let lastRows=null;
function gen(){
  const S=st(document.getElementById('S').value.trim());
  const H=st(document.getElementById('H').value.trim());
  const k1=+document.getElementById('k1').value||0.32, k2=+document.getElementById('k2').value||0.45;
  if(!S||!H){document.getElementById('hint').textContent='未收录 学校/出发地';return;}
  const rec=loadRec();
  const rows=[];
  for(const s of STATIONS){
    if(s[0]===S.name||s[0]===H.name)continue; if(s[1]===S.city||s[1]===H.city)continue;
    const D={lat:s[2],lon:s[3]};
    const a=assess(S,H,D,k1,k2);
    const real=rec[s[0]]||'';
    rows.push({st:s,name:s[0],city:s[1],cls:a.cls,conf:a.conf,evidence:a.evidence,real,manual:false});
  }
  rows.sort((a,b)=>a.conf-b.conf);
  lastRows={rows,S:H?S:H,H:H,k1,k2};
  const n=rows.length,g=rows.filter(r=>r.cls===2).length,eo=rows.filter(r=>r.cls===1).length,b=rows.filter(r=>r.cls===0).length;
  document.getElementById('stats').innerHTML=
    '<span class="st">站数 <b>'+n+'</b></span>'+
    '<span class="st">预测可出 <b style="color:#16a34a">'+g+'</b></span>'+
    '<span class="st">可能被查 <b style="color:#d97706">'+eo+'</b></span>'+
    '<span class="st">预测拦截 <b style="color:#dc2626">'+b+'</b></span>'+
    '<span class="st">置信度&lt;60% <b style="color:#dc2626">'+rows.filter(r=>r.conf<60).length+'</b></span>'+
    '<span class="st">已记录实测 <b>'+rows.filter(r=>r.real).length+'</b></span>';
  document.getElementById('hint').innerHTML=
    '当前区间 <b>'+S.name+' ↔ '+H.name+'</b>（区间长 '+Math.round(dist(S,H))+'km · k1='+k1+' k2='+k2+'）。'+
    '低置信度在前 —— 优先验证这些；每填一条实测会存到本地，点【校准】用你的数据拟合参数。';
  renderTable(rows);
}
function renderTable(rows){
  let h='<tr><th>车站</th><th>城市</th><th>预测</th><th>置信度</th><th>为什么(几何依据)</th><th>我的实测</th><th>我手动改过</th></tr>';
  const clsTag={2:'<span class="tag ok">可出票</span>',1:'<span class="tag edge">可能被查</span>',0:'<span class="tag bad">拦截</span>'};
  for(const r of rows){
    const low=r.conf<60?' class="low"':'';
    h+='<tr'+low+'><td>'+r.name+'</td><td>'+r.city+'</td><td>'+clsTag[r.cls]+'</td>'+
      '<td class="conf">'+r.conf+'%</td><td style="white-space:normal">'+r.evidence+'</td>'+
      '<td><select data-n="'+r.name+'" onchange="rec(this)">'+
      '<option value=""'+(r.real===''?' selected':'')+'>未测</option>'+
      '<option value="ok"'+(r.real==='ok'?' selected':'')+'>可出票(正确)</option>'+
      '<option value="bad"'+(r.real==='bad'?' selected':'')+'>被拦截</option></select></td>'+
      '<td><input type="checkbox" data-n="'+r.name+'"'+(r.manual?' checked':'')+' onchange="mark(this)"> 改过=已验证</td></tr>';
  }
  const thead='<thead>'+h.slice(4)+'</thead>'; // h 以 <tr> 开头, slice(4) 去掉第一个 '<tr>'
  document.getElementById('tab').innerHTML=thead+'<tbody>'+h.replace(/^<tr>/,'').replace(/</tr>$/,'')+'</tbody>';
}
function rec(sel){ const rec=loadRec(); rec[sel.dataset.n]=sel.value; saveRec(rec); flash('已记录 '+sel.dataset.n+'：'+sel.value+'（'+((sel.value==='bad')?'你的实测=拦截→算法需修正':'可出票→算法正确')+'）'); }
function mark(cb){ const rec=loadRec(); if(!rec[cb.dataset.n])rec[cb.dataset.n]={}; saveRec(rec); flash('已标记「'+cb.dataset.n+'」为手动改过=正确'); }
function flash(m){ document.getElementById('hint').textContent=m; }
function clearRec(){ localStorage.removeItem(storeKey); gen(); }
function exportCSV(){
  if(!lastRows)return;
  const S=lastRows.S.name,H=lastRows.H.name;
  let c='学校,出发地,车站,城市,预测,置信度%,依据,我的实测\n';
  for(const r of lastRows.rows) c+=[S,H,r.name,r.city,['拦截','可能被查','可出票'][r.cls],r.conf,r.evidence,r.real||''].join(',')+'\n';
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('\ufeff'+c);a.download='出票验证_'+S+'_'+H+'.csv';a.click();
}
/* 校准: 网格搜索 k1,k2 使与你的实测一致度最高 */
function calibrate(){
  if(!lastRows)return;
  const rec=loadRec(); const tested=lastRows.rows.filter(r=>r.real);
  const el=document.getElementById('calib');
  if(!tested.length){el.className='calib full';el.innerHTML='<b>请先在表格里记录至少 1 条实测</b>（选"可出票"或"被拦截"），再点校准。你每天 4 条真实数据，攒几条效果更好。';return;}
  const S=lastRows.S,H=lastRows.H;
  let best=null;
  for(let k1=0.20;k1<=0.52;k1+=0.01)for(let k2=0.30;k2<=0.62;k2+=0.01){
    if(k2<k1)continue;
    let acc=0;
    for(const r of tested){ const a=assess(S,H,{lat:r.st[2],lon:r.st[3]},k1,k2); const pred=a.cls===0?'bad':'ok'; if(pred===r.real)acc++; }
    const score=acc/tested.length;
    if(!best||score>best.score||(score===best.score&&Math.abs(k1-0.32)+Math.abs(k2-0.45)<best.dist)) best={score,k1,k2,dist:Math.abs(k1-0.32)+Math.abs(k2-0.45)};
  }
  const fit=Math.round(best.score*100);
  const cur=Math.round(tested.filter(r=>{const a=assess(S,H,{lat:r.st[2],lon:r.st[3]},0.32,0.45);return (a.cls===0?'bad':'ok')===r.real}).length/tested.length*100);
  el.className='calib full';
  el.innerHTML='<b>校准结果（基于你的 '+tested.length+' 条实测）</b><br>'+
    '当前参数(0.32/0.45) 拟合度 <b>'+cur+'%</b> → 推荐参数 k1=<b>'+best.k1.toFixed(2)+'</b> k2=<b>'+best.k2.toFixed(2)+'</b>，拟合度 <b style="color:#16a34a">'+fit+'%</b><br>'+
    '<div class="note">验证它：把上方 k1/k2 改成推荐值 → 点【生成表格】看低置信度站是否转入你实测的状态。'+
    '<b>注意</b>：本页只是拟合演示，<b>不会修改正式逻辑</b>；连续多次拟合 &gt;90% 且稳定后，再把参数写进 index.html。</div>'+
    '<button class="ghost" onclick="applyCalib('+best.k1.toFixed(2)+','+best.k2.toFixed(2)+')">应用推荐参数到本表</button>';
}
function applyCalib(k1,k2){ document.getElementById('k1').value=k1; document.getElementById('k2').value=k2; gen(); }
/* 首次生成 */
gen();
