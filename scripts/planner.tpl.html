<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生票区间规划</title>
<style>
:root{
  --bg:#faf9f6; --paper:#ffffff; --ink:#1c1917; --mut:#78716c; --mut2:#a8a29e;
  --accent:#4f46e5; --accent-soft:rgba(79,70,229,.07); --accent-line:rgba(79,70,229,.22);
  --ok:#15803d; --ok-soft:rgba(22,163,74,.07); --ok-line:rgba(22,163,74,.25);
  --no:#dc2626; --no-soft:rgba(220,38,38,.05); --no-line:rgba(220,38,38,.22);
  --warn:#d97706; --warn-soft:rgba(245,158,11,.08); --warn-line:rgba(245,158,11,.3);
  --line:#e7e5e4; --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:26px 16px 60px}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
h1 .dot{width:10px;height:10px;border-radius:99px;background:var(--accent)}
.sub{color:var(--mut);font-size:12.5px;margin:6px 0 22px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
.step-no{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:99px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;margin-right:10px}
.step:not(.on){display:none}
.step h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center}
input[type=text]{width:100%;padding:12px 14px;font-size:15px;border:1.5px solid var(--line);border-radius:12px;outline:none;transition:border-color .15s;background:#fff;color:var(--ink)}
input[type=text]:focus{border-color:var(--accent)}
input[type=text]::placeholder{color:var(--mut2)}

button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-size:14.5px;font-weight:700;transition:filter .15s,transform .05s;width:100%;margin-top:14px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.99)}
.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:600}
.ghost:hover{border-color:#d6d3d1;background:#fafaf9}
.err{color:var(--no);font-size:12.5px;margin-top:8px}

.dep-line{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);background:#fafaf9;border:1px dashed var(--line);border-radius:10px;padding:7px 11px;margin-bottom:12px}
.dep-line b{color:var(--ink)}

.trip{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;background:#fff;transition:border-color .15s,background .15s}
.trip[draggable=true]{cursor:grab}
.trip.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-line)}
.trip .t{flex:1;font-size:14px;font-weight:600}
.trip .route{font-size:11.5px;color:var(--mut)}
.trip .grip{color:var(--mut2);cursor:grab;font-size:13px;letter-spacing:-2px}
.trip .del{background:none;border:none;color:var(--mut2);font-size:15px;cursor:pointer;padding:2px 6px;border-radius:8px}
.trip .del:hover{color:var(--no);background:var(--no-soft)}
.chip{font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px;border:1px solid;white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.chip.no{color:var(--no);background:var(--no-soft);border-color:var(--no-line)}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.chip.mut{color:var(--mut);background:#fafaf9;border-color:var(--line)}
.chip.use{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.trip.done-ok{border-color:var(--ok-line);background:var(--ok-soft)}
.trip.done-no{border-color:var(--no-line);background:var(--no-soft)}

.sum{font-size:17px;font-weight:800;margin-bottom:6px}
.sum b{color:var(--accent)}
.note{font-size:12.5px;color:var(--mut);margin-bottom:14px}
.rec{border:1.5px solid var(--accent-line);background:var(--accent-soft);border-radius:14px;padding:13px 14px;font-size:13.5px;margin-bottom:8px;line-height:1.7}
.rec b{color:var(--accent)}
.rec .mini{font-size:12px;margin-top:4px;color:var(--mut)}
details{margin-top:10px}
summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--mut);font-weight:600;padding:8px 0;user-select:none}
summary::before{content:'▸ ';display:inline-block;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
summary:hover{color:var(--ink)}
.mini-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;font-size:13px}
.mini-row .n{flex:1;font-weight:700}
.mini-row .d{color:var(--mut);font-size:11.5px}
input[type=range]{width:100%;accent-color:var(--accent);margin-top:10px}
.param-line{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--mut);margin-top:6px}
.bridge{font-size:12px;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:10px;padding:7px 10px;margin-top:6px;line-height:1.55}
.bridge b{color:#b45309}
.hidden{display:none!important}
@media(max-width:520px){
  body{padding:18px 12px 50px}
  .card{padding:16px}
  h1{font-size:19px}
  input[type=text]{font-size:16px}
  .btn{padding:14px 18px;font-size:15.5px}
  .ghost{min-height:40px}
  #tripInput{width:100%!important;margin:0 0 8px!important}
  #stepTrips .ghost{width:100%}
  .trip{padding:12px 11px}
  .dep-line{flex-wrap:wrap;line-height:1.5}
  .chip{font-size:11px;padding:2px 8px}
  .rec{font-size:13px}
  summary{padding:10px 0}
}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>学生票 · 区间规划</h1>
  <div class="sub">输入学校与出发地，多程自动串联成一条路线，看能否全程用学生票。</div>

  <div class="card step on" id="stepSchool">
    <h2><span class="step-no">1</span>学校在哪</h2>
    <input type="text" id="schoolInput" placeholder="例如：北京 / 武汉 / 成都东" autocomplete="off">
    <button class="btn" onclick="nextSchool()">下一步</button>
  </div>

  <div class="card step" id="stepHome">
    <h2><span class="step-no">2</span>出发地（家的车站）</h2>
    <input type="text" id="homeInput" placeholder="例如：石家庄 / 南宁 / 福州" autocomplete="off">
    <button class="btn" onclick="nextHome()">下一步</button>
  </div>

  <div class="card step" id="stepTrips">
    <h2><span class="step-no">3</span>想去哪（按顺序串联成一条路线）</h2>
    <div class="dep-line" id="depLine">📍 出发地：<b>——</b><span>（路线从这里出发，按下面顺序走完再回这里）</span></div>
    <input type="text" id="tripInput" placeholder="目的地，如：桂林 / 广州" autocomplete="off" style="width:calc(100% - 96px);margin-right:8px">
    <button class="ghost" onclick="addTrip()" style="vertical-align:top">＋ 添加</button>
    <div id="tripErr" class="err"></div>
    <div id="tripList" style="margin-top:14px"></div>
    <label style="display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut)">
      <input type="checkbox" onchange="setRound(this.checked)">全程往返 ×2</label>
    <button class="btn" onclick="onPlan()">🚀 一键规划</button>
  </div>

  <div id="result"></div>
</div>

<script>
/*__PURE_LOGIC__*/

/* ============ 极简界面逻辑 ============ */
const $ = id => document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showStep(name){document.querySelectorAll('.step').forEach(el=>el.classList.remove('on'));$('step'+name).classList.add('on');}
function resolvePlace(q){
  q=String(q||'').trim();
  const qn=cleanCity(q);
  const hits=STATIONS.filter(s=>s[0]===qn||s[1]===qn||s[1].includes(qn)||qn.includes(s[1]));
  if(!hits.length)return null;
  const h=hits.find(s=>s[4])||hits[0];
  return {point:{lat:h[2],lon:h[3]},station:{name:h[0],city:h[1],lat:h[2],lon:h[3]}};
}
function nextSchool(){
  const r=resolvePlace($('schoolInput').value);
  if(!r){setErr('stepSchool','未收录该站，试试输入 城市名 或 车站名');return;}
  state.school={text:$('schoolInput').value.trim(),point:r.point,station:r.station};
  $('schoolInput').value=r.station.name;
  showStep('Home');
}
function nextHome(){
  const r=resolvePlace($('homeInput').value);
  if(!r){setErr('stepHome','未收录该站');return;}
  state.home={text:$('homeInput').value.trim(),point:r.point,station:r.station};
  state.depart=state.home.station;
  $('homeInput').value=r.station.name;
  $('depLine').innerHTML='📍 出发地：<b>'+esc(r.station.name)+'</b><span>（路线从这里出发，按下面顺序走完再回这里）</span>';
  showStep('Trips');
}
function setErr(step,t){const e=document.querySelector('#'+step+' .err');if(e)e.textContent=t;}
function addTrip(){
  const q=$('tripInput').value.trim();
  if(!q)return;
  const r=resolvePlace(q);
  if(!r){$('tripErr').textContent='未收录「'+q+'」';return;}
  $('tripErr').textContent='';
  state.trips.push({id:++state._tid,text:q,point:r.point,station:r.station,round:false});
  $('tripInput').value='';
  planned=false;
  renderTrips();renderResult();
}
let dragId=null;
function tStart(e,id){dragId=id;if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);}}
function tOver(e,id){e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='move';document.querySelectorAll('.trip').forEach(r=>r.classList.remove('drag-over'));if(e.currentTarget)e.currentTarget.classList.add('drag-over');}
function tDrop(e,id){
  e.preventDefault();
  document.querySelectorAll('.trip').forEach(r=>r.classList.remove('drag-over'));
  if(dragId==null||dragId===id){dragId=null;return;}
  const i=state.trips.findIndex(t=>t.id===dragId),j=state.trips.findIndex(t=>t.id===id);
  if(i<0||j<0){dragId=null;return;}
  const [it]=state.trips.splice(i,1);
  state.trips.splice(j,0,it);
  dragId=null;planned=false;
  renderTrips();renderResult();
}
function renderTrips(){
  const el=$('tripList');
  if(!state.trips.length){el.innerHTML='<div style="color:var(--mut2);font-size:12.5px;padding:4px 2px">还没有目的地（顺序=路线顺序，可拖动排序）</div>';return;}
  el.innerHTML=state.trips.map(t=>{
    return '<div class="trip" draggable="true" ondragstart="tStart(event,'+t.id+')" ondragover="tOver(event,'+t.id+')" ondrop="tDrop(event,'+t.id+')">'+
      '<span class="grip" title="拖动排序">⠿</span>'+
      '<div class="t"><div>'+esc(t.text)+'</div>'+
      '<div class="route">第 '+(state.trips.indexOf(t)+1)+' 程</div></div>'+
      '<button class="del" onclick="rm('+t.id+')">×</button></div>';
  }).join('');
}
function rm(id){state.trips=state.trips.filter(t=>t.id!==id);planned=false;renderTrips();renderResult();}
function setRound(v){state.trips.forEach(t=>t.round=v);planned=false;renderTrips();renderResult();}
let planned=false;
function routeChain(S,H){return chainV2(S,H,state.trips.map(t=>t.station),H,H);}
function roundAny(){return state.trips.some(t=>t.round);}
function onPlan(){
  if(!state.school||!state.home){$('tripErr').textContent='请先完成 学校 与 出发地';return;}
  planned=true;renderTrips();renderResult();
}
function renderResult(){
  const el=$('result');
  if(!planned||!state.school||!state.home||!state.trips.length){el.innerHTML='';return;}
  const S=state.school.station,H=state.home.station;
  const cc=routeChain(S,H);
  const N=cc.segs.length,okN=cc.okN;
  const used=cc.okAll?(roundAny()?2:1):0;
  const remain=Math.max(0,state.budget-used);
  const sup=chainBestLocal();
  const curCover=cc.okN;
  let html='<div class="card" id="resCard"><div class="sum">'+
    (cc.okAll?'✅ 联程全程可出 🎉':'<b>'+okN+'/'+N+'</b> 段在区间内 · '+(N-okN)+' 段需另购')+
    '</div><div class="note">出发地 '+esc(H.name)+' · 区间 '+esc(S.name)+' ⇄ '+esc(H.name)+' · '+
    (cc.okAll?'全程联程 <b>'+used+'</b> 次 · 剩余 <b>'+remain+'</b> 次':'按 分段/搭桥 另计')+'</div>';
  // 路线串联图: 站点chips + 段箭头着色
  html+='<div style="display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;margin-bottom:12px;font-size:13px">';
  const pts=[H,...state.trips.map(t=>t.station),H];
  for(let i=0;i<pts.length;i++){
    if(i>0){html+='<span style="color:'+(cc.segs[i-1].inInt?'var(--ok)':'var(--no)')+';font-weight:800">'+(cc.segs[i-1].inInt?'→':'⇢')+'</span>';}
    const badAdj=(i>0&&!cc.segs[i-1].inInt)||(i<pts.length-1&&!cc.segs[i].inInt);
    html+='<span class="chip '+(badAdj?'no':'ok')+'">'+esc(pts[i].name)+'</span>';
  }
  html+='</div>';
  if(!cc.okAll){
    html+='<div style="margin-bottom:8px">'+cc.segs.map((sg,i)=>
      '<div style="font-size:12px;color:var(--mut);padding:3px 0">'+(i+1)+'. '+esc(sg.a.name)+' → '+esc(sg.b.name)+' '+
      (sg.inInt?'<span class="chip ok">区间内</span>':'<span class="chip no">区间外</span>')+'</div>').join('')+'</div>';
    html+='<div class="bridge">⚠ '+(N-okN)+' 段区间外：可<b>分段购买</b>（区间内段学生票+区间外段全价）；或先购「区间内 → '+esc(H.name)+'」合法票再购后续段（搭桥法，实测有效），最后退掉第一张。</div>';
  }
  if(sup&&sup.st){
    html+=(sup.cover>curCover)
      ?'<div class="rec">💡 把<b>家</b>改成 <b>'+esc(sup.st.name)+' · '+esc(sup.st.city)+'</b> → 联程可出 <b>'+sup.cover+'/'+N+'</b> 段'+(sup.cover<N?'（最高）':'')+
        '<div class="mini">覆盖优先 · p/L='+sup.pMax.toFixed(2)+'（越居中越稳）</div></div>'+
        '<button class="btn" style="margin-top:8px" onclick="adopt(\''+sup.st.name+'\')">采用推荐区间</button>'
      :'<div class="rec">💡 当前区间已是最优（联程 '+curCover+'/'+N+' 段），无更好的家端点</div>';
  }
  html+='<details><summary>更多家端点（区间优化）</summary>'+optRows()+'</details>';
  html+='<details><summary>参数：绕远倍数（通道判定上限）</summary>'+paramHTML()+'</details>';
  html+='</div>';
  el.innerHTML=html;
}
function chainBestLocal(){
  const S=state.school.station,H=state.home.station;
  const sts=state.trips.map(t=>t.station);
  const curCover=routeChain(S,H).okN;
  let best=null;
  for(const s of STATIONS){
    if(s[0]===S.name)continue;
    if(!railAdj().nodes.has(s[1]))continue;
    if(s[1]===H.city)continue; // 不再推荐当前家的同城站
    const H2={name:s[0],city:s[1],lat:s[2],lon:s[3]};
    const cc=chainV2(S,H2,sts,H2,H2);
    const cover=cc.okN;
    if(cover<curCover)continue;
    const Lh=dist(S,H2);
    let pMax=0;
    for(const sg of cc.segs){if(sg.inInt){const{p}=corridor(S,H2,sg.b);pMax=Math.max(pMax,p/(Lh||1));}}
    const km=dist({lat:s[2],lon:s[3]},{lat:H.lat,lon:H.lon});
    if(!best||cover>best.cover||(cover===best.cover&&(pMax<best.pMax||(pMax===best.pMax&&km<best.km))))
      best={st:{name:s[0],city:s[1],lat:s[2],lon:s[3]},cover,pMax};
  }
  return best;
}
function optRows(){
  const S=state.school.station,H=state.home.station;
  const sts=state.trips.map(t=>t.station);
  const rows=[];
  for(const s of STATIONS){
    if(s[0]===S.name)continue;
    if(!railAdj().nodes.has(s[1]))continue;
    if(s[1]===H.city)continue;
    const H2={name:s[0],city:s[1],lat:s[2],lon:s[3]};
    const cc=chainV2(S,H2,sts,H2,H2);
    if(!cc||cc.okN===0)continue;
    rows.push({s,cover:cc.okN});
  }
  rows.sort((a,b)=>b.cover-a.cover);
  return rows.slice(0,8).map(r=>'<div class="mini-row"><div class="n">'+esc(r.s[0])+' · '+esc(r.s[1])+'</div><div class="d">联程可出 '+r.cover+'/'+(sts.length+2)+' 段</div>'+
    '<button class="ghost" onclick="adopt(\''+r.s[0]+'\')">采用</button></div>').join('');
}
function adopt(name){
  const r=resolvePlace(name);
  if(!r)return;
  state.home={text:r.station.name,point:r.point,station:r.station};
  state.depart=state.home.station;
  $('depLine').innerHTML='📍 出发地：<b>'+esc(r.station.name)+'</b><span>（路线从这里出发，按下面顺序走完再回这里）</span>';
  onPlan();
}
function paramHTML(){
  const v=state.ratioMax;
  return '<div style="font-size:12.5px;color:var(--mut)">当前 '+v+'（默认 2.5 · 用户值 localStorage 优先）</div>'+
    '<input type="range" id="ratioRange" min="1" max="6" step="0.1" value="'+v+'" oninput="setRatio(this.value)">'+
    '<div class="param-line"><span>1（严格）</span><span style="flex:1;text-align:center">更小=更严 · 2.5=实测最优</span><span>6（宽松）</span></div>'+
    '<button class="ghost" onclick="resetRatio()">↺ 重置 2.5</button>';
}
function setRatio(v){
  state.ratioMax=Math.min(20,Math.max(1,+v||2.5));
  try{localStorage.setItem('srp_ratioMax',state.ratioMax);}catch(e){}
  _nearCache=null;
  renderTrips();renderResult();
}
function resetRatio(){
  try{localStorage.removeItem('srp_ratioMax');}catch(e){}
  state.ratioMax=2.5;_nearCache=null;
  renderTrips();renderResult();
}
(function(){
  try{
    const raw=localStorage.getItem('srp_ratioMax');
    state.ratioMax=(raw&&isFinite(+raw)&&+raw>=1&&+raw<=20)?+raw:2.5;
  }catch(e){state.ratioMax=2.5;}
  state.budget=4;
})();
</script>
</body>
</html>
