<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RailGo · 铁路旅行规划</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- 顶部: 旅行摘要(唯一的总时间/总价来源 = TripState.totals) -->
<header class="topbar">
  <div class="brand">RailGo</div>
  <div class="summary" id="summary">
    <div class="route-line" id="sumRoute">设定起点与终点开始</div>
    <div class="stats">
      <span id="sumDays">5 天</span>
      <span id="sumTotal">—</span>
      <span class="ok" id="sumFeasible">待规划</span>
    </div>
  </div>
  <button class="btn ghost" id="btnEdit">修改行程</button>
</header>

<!-- 出行输入(首次进入展开; 规划后收起为顶部状态) -->
<section class="setup" id="setup">
  <div class="row">
    <label>起点</label>
    <input id="inOrigin" list="cityList" placeholder="城市名，如 北京">
    <label>终点</label>
    <input id="inDest" list="cityList" placeholder="城市名，如 上海">
  </div>
  <div class="row">
    <label>天数</label>
    <select id="inDays">
      <option>3</option><option>4</option><option selected>5</option>
      <option>6</option><option>7</option><option>10</option>
    </select>
    <label>预算（元）</label>
    <input id="inBudget" type="number" value="1860" min="100" step="50">
    <label>偏好</label>
    <div class="chips" id="prefChips">
      <span class="chip on" data-pref="balanced">大众默认</span>
      <span class="chip" data-pref="play">游玩优先</span>
      <span class="chip" data-pref="time">时间优先</span>
      <span class="chip" data-pref="money">省钱优先</span>
      <span class="chip" data-pref="comfort">舒适优先</span>
    </div>
  </div>
  <div class="row">
    <label>愿意为途经城市额外花多久</label>
    <div class="chips" id="stopoverChips"></div>
  </div>
  <button class="btn primary" id="btnPlan">生成路线</button>
  <div class="hint" id="setupHint"></div>
</section>

<!-- 主体: 铁路主路线(可拖入) + 地图 -->
<main class="stage">
  <section class="rail" id="rail">
    <div class="rail-track"></div>
    <div class="rail-nodes" id="railNodes"></div>
    <div class="drop-slot" id="dropSlot" hidden>
      <div class="drop-inner"><span>拖入此处</span></div>
    </div>
  </section>

  <!-- 地图 = 城市内路线的执行层 -->
  <section class="mapwrap">
    <div id="baiduMap" class="map" hidden></div>
    <div id="mapFallback" class="map-fallback">
      <div class="mf-icon">🗺️</div>
      <div class="mf-text" id="mapFallbackText">尚未配置百度地图 Key</div>
      <div class="mf-hint">配置后此处显示真实地图与城市内步行路线；当前可用下方城市路线列表查看顺序。</div>
    </div>
    <div class="map-note" id="mapNote"></div>
  </section>

  <!-- 沿途候选(不显示数字评分: 序号 + 自然语言理由) -->
  <aside class="cands" id="cands">
    <h3>沿途最值得停留</h3>
    <div class="cand-list" id="candList"></div>
  </aside>
</main>

<!-- 底部: 选中城市的体验编辑器 -->
<section class="citybar" id="citybar" hidden>
  <div class="citybar-head">
    <div class="cb-left">
      <h2 id="cbName">城市</h2>
      <span class="pill" id="cbStay">4 小时</span>
      <span class="pill ghost" id="cbCount">0 个体验</span>
    </div>
    <div class="cb-right">
      <button class="btn small ghost" id="btnRotate">↻ 换一组未锁定的体验</button>
      <button class="btn small ghost danger" id="btnRemoveCity">移除此城市</button>
    </div>
  </div>
  <div class="stay-range">
    <input type="range" id="stayRange" min="0" max="5" step="1" value="2">
    <div class="range-scale"><span>不停留</span><span>2 小时</span><span>4 小时</span><span>6-8 小时</span><span>1 天</span><span>2 天以上</span></div>
  </div>
  <div class="exp-line" id="expLine"></div>
  <div class="status" id="cityStatus"></div>
</section>

<datalist id="cityList"></datalist>
<div class="toast" id="toast" hidden></div>

<script src="config.local.js"></script>
<script src="mock-data.js"></script>
<script src="railgo.core.js"></script>
<script src="baidu-api.js"></script>
<script src="baidu-map.js"></script>
<script src="trip-state.js"></script>
<script src="app.js"></script>
</body>
</html>
